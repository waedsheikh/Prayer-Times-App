<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azan App</title>
    <style>
        :root {
            --bg1: #eef2ff;
            --bg2: #e0f2fe;
            --card: #ffffff;
            --primary: #4f46e5;
            --accent: #0ea5e9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }

        .container {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            width: 360px;
            border: 1px solid var(--border);
        }

        h2 {
            margin: 0 0 12px;
        }

        .inputs {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        input {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            cursor: pointer;
        }

        .header {
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            font-weight: bold;
            text-align: center;
        }

        .grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .card {
            padding: 10px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            border: 1px solid var(--border);
        }

        .name {
            font-size: 12px;
            color: var(--muted);
        }

        .time {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Prayer Times</h2>
        <div class="inputs">
            <input type="text" id="date" placeholder="DD-MM-YYYY">
            <input type="text" id="city" placeholder="City">
            <input type="text" id="country" placeholder="Country code (e.g. GB)">
            <button onclick="getPrayerTimes()">Get Times</button>
        </div>
        <div id="result"></div>
    </div>




    <script>
        const API_URL = "https://api.aladhan.com/v1";
        const date = "22-22-2022";
        const routeByCity = `/timingsByCity/${date}?city=london&country=GB`;
        async function getPrayerTimes() {
            const dateInput = document.getElementById('date').value;
            const city = document.getElementById('city').value.trim();
            const country = document.getElementById('country').value.trim();
            const resultDiv = document.getElementById('result');

            if (!city || !country) {
                resultDiv.innerHTML = '<div class="error">Please enter both a city and country code.</div>';
                return;
            }

            // Format Date to DD-MM-YYYY required by Aladhan API
            let formattedDate = '';
            if (dateInput) {
                const [year, month, day] = dateInput.split('-');
                formattedDate = `${day}-${month}-${year}`;
            } else {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = today.getFullYear();
                formattedDate = `${day}-${month}-${year}`;
            }

            resultDiv.innerHTML = '<div class="loader"></div>';

            try {
                const response = await fetch(
                    `https://api.aladhan.com/v1/timingsByCity/${formattedDate}?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}`
                );

                if (!response.ok) throw new Error('Network response failed');

                const data = await response.json();

                if (data.code !== 200 || !data.data) {
                    resultDiv.innerHTML = '<div class="error">Prayer times not found for these details.</div>';
                    return;
                }

                const timings = data.data.timings;
                const dateObj = data.data.date;
                const keyPrayers = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

                let cardsHtml = keyPrayers
                    .map(
                        (prayer) => `
              <div class="card">
                <div class="name">${prayer}</div>
                <div class="time">${timings[prayer]}</div>
              </div>
            `
                    )
                    .join('');

                resultDiv.innerHTML = `
            <div class="header">
              ${city.toUpperCase()}, ${country.toUpperCase()}<br/>
              <span style="font-size: 12px; font-weight: normal; color: var(--muted);">
                ${dateObj.readable} (${dateObj.hijri.day} ${dateObj.hijri.month.en} ${dateObj.hijri.year})
              </span>
            </div>
            <div class="grid">
              ${cardsHtml}
            </div>
          `;
            } catch (error) {
                resultDiv.innerHTML = '<div class="error">Failed to fetch prayer times. Check your network or details.</div>';
            }
        }
    </script>


</body>

</html>
